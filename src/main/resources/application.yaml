spring:
  application:
    name: erp-procurement
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:15434}/procurement_db}
    username: ${SPRING_DATASOURCE_USERNAME:procurement_app}
    password: ${SPRING_DATASOURCE_PASSWORD:procurement_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8084}
